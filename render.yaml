services:
  # --------------------------------------------------------------------------
  # 1. Backend Web Service (Express REST API)
  # --------------------------------------------------------------------------
  - type: web
    name: reachinbox-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RUN_WORKER_IN_PROCESS
        value: "false" # In production, the dedicated background worker executes queue jobs
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel frontend URL, e.g. https://reachinbox.vercel.app
      - key: FRONTEND_URL
        sync: false # Set to your Vercel frontend URL
      - key: JWT_SECRET
        generateValue: true # Generates a secure random 32+ character JWT secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SLACK_TOKEN_ENCRYPTION_KEY
        generateValue: true # 32-byte hex encryption key for Slack bot tokens (AES-256-GCM)
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false # e.g. https://reachinbox-api.onrender.com/api/auth/slack/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false # e.g. smtp.sendgrid.net, email-smtp.us-east-1.amazonaws.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "ReachInbox Scheduler"
      - key: ELASTICSEARCH_URL
        sync: false # Optional managed Elastic Cloud URL

  # --------------------------------------------------------------------------
  # 2. BullMQ Email Background Worker (Persistent Process - Non-Serverless)
  # --------------------------------------------------------------------------
  - type: worker
    name: reachinbox-worker
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: DEFAULT_MIN_DELAY_SECONDS
        value: "2"
      - key: DEFAULT_MAX_HOURLY_LIMIT
        value: "200"
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: SLACK_TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: SLACK_TOKEN_ENCRYPTION_KEY
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "ReachInbox Scheduler"
      - key: ELASTICSEARCH_URL
        sync: false

# ----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ----------------------------------------------------------------------------
databases:
  - name: reachinbox-postgres
    databaseName: reachinbox_db
    user: reachinbox_user
    plan: starter

# ----------------------------------------------------------------------------
# 4. Managed Redis Service (Key Value)
# ----------------------------------------------------------------------------
# Render Redis / Key Value service configuration
# Important: maxmemory-policy should be noeviction so BullMQ jobs and delayed sets are never evicted
